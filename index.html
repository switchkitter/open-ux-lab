<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open UX Lab</title>
    <meta name="description" content="Free UX practice: short lessons, then exercises where you pick the better design and see why." />
    <link rel="canonical" href="https://openuxlab.com/" />
    <!-- Link previews (iMessage, Slack, LinkedIn, WhatsApp...). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open UX Lab" />
    <meta property="og:title" content="Open UX Lab: free UX practice" />
    <meta property="og:description" content="Short lessons, then exercises where you pick the better design and see why. Free, no account needed." />
    <meta property="og:url" content="https://openuxlab.com/" />
    <meta property="og:image" content="https://openuxlab.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open UX Lab: learn UX by judging real interface decisions. Example exercise comparing two form hints, where the higher-contrast one is correct." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open UX Lab: free UX practice" />
    <meta name="twitter:description" content="Short lessons, then exercises where you pick the better design and see why. Free, no account needed." />
    <meta name="twitter:image" content="https://openuxlab.com/og-image.png" />
    <meta name="twitter:image:alt" content="Open UX Lab: learn UX by judging real interface decisions. Example exercise comparing two form hints, where the higher-contrast one is correct." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="UX Lab" />
    <!-- Apply a saved light or dark theme and accent color before the page draws (see src/lib/theme.ts and accent.ts). -->
    <script>
      try {
        var theme = localStorage.getItem("open-ux-lab:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        var accent = localStorage.getItem("open-ux-lab:accent");
        if (accent && /^[a-z]+$/.test(accent)) document.documentElement.dataset.accent = accent;
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
